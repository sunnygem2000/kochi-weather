<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kochi Weather</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06283d;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:flex}
#app{width:100%;height:100%;padding:26px 38px 20px;display:flex;flex-direction:column;background:linear-gradient(135deg,#073b59 0%,#05283e 55%,#031d30 100%)}
.top{display:flex;justify-content:space-between;align-items:flex-start;height:72px;flex:none}
.location{font-size:37px;font-weight:800;letter-spacing:.4px}
.date{font-size:19px;opacity:.78;margin-top:4px}
.updated{font-size:16px;opacity:.72;margin-top:8px}
.main{display:grid;grid-template-columns:1.15fr 1fr;gap:34px;height:255px;flex:none;align-items:center}
.current{display:flex;align-items:center;gap:28px}
.currentIcon{font-size:105px;line-height:1}
.temp{font-size:112px;font-weight:800;line-height:.86;letter-spacing:-4px}
.unit{font-size:42px;font-weight:700;vertical-align:top;margin-left:4px}
.condition{font-size:29px;font-weight:800;margin-top:14px}
.feels{font-size:21px;font-weight:600;opacity:.85;margin-top:6px}
.hl{font-size:23px;font-weight:800;margin-top:9px}
.hl span{margin-right:22px}
.details{border-left:2px solid rgba(255,255,255,.25);padding-left:34px;display:grid;grid-template-columns:34px 1fr 1fr;row-gap:13px;align-items:center;font-size:21px}
.details .ico{font-size:25px;text-align:center}
.details .label{opacity:.78}
.details .value{font-weight:700;text-align:left}
.sectionTitle{font-size:24px;font-weight:800;margin-bottom:9px;letter-spacing:.3px}
.weeklySection{height:185px;flex:none}
.weekly{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;height:148px}
.daycard{background:rgba(255,255,255,.09);border-radius:15px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.daycard.today{outline:2px solid rgba(80,190,255,.85);background:rgba(60,160,220,.16)}
.dayname{font-size:18px;font-weight:800}
.daydate{font-size:14px;opacity:.75;margin-top:-2px}
.dayico{font-size:34px;line-height:1}
.daytemp{font-size:19px;font-weight:800}
.dayrain{font-size:14px;opacity:.8}
.hourlySection{flex:1;min-height:0}
.hourly{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;height:105px}
.card{background:rgba(255,255,255,.09);border-radius:13px;padding:8px 4px;text-align:center;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.card .time{font-size:15px;font-weight:700;opacity:.82}
.card .ico{font-size:27px;line-height:1}
.card .ct{font-size:22px;font-weight:800}
.card .rain{font-size:13px;opacity:.75}
.footer{display:flex;justify-content:space-between;align-items:center;height:25px;margin-top:8px;font-size:13px;opacity:.55;flex:none}
#loading{font-size:25px;margin:auto}
#tap{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:10;cursor:pointer}
#tap div{background:#fff;color:#111;border-radius:18px;padding:24px 34px;text-align:center;font-size:27px;font-weight:700}
#tap small{display:block;font-size:16px;font-weight:400;margin-top:8px;opacity:.7}
.hidden{display:none!important}
@media(max-width:900px){
 #app{padding:18px 22px 14px}
 .location{font-size:30px}.date{font-size:16px}.updated{font-size:14px}
 .main{grid-template-columns:1fr 1fr;gap:18px;height:245px}
 .current{gap:15px}.currentIcon{font-size:70px}.temp{font-size:82px}.unit{font-size:32px}.condition{font-size:23px}.feels{font-size:17px}.hl{font-size:19px}
 .details{padding-left:18px;font-size:16px;grid-template-columns:26px 1fr 1fr}.details .ico{font-size:19px}
 .sectionTitle{font-size:20px}.weekly{gap:6px}.daycard{padding:7px 3px}.dayname{font-size:15px}.daydate{font-size:12px}.dayico{font-size:27px}.daytemp{font-size:16px}.dayrain{font-size:11px}
 .hourly{gap:6px}.card .time{font-size:13px}.card .ico{font-size:23px}.card .ct{font-size:19px}.card .rain{font-size:11px}
}
</style>
</head>
<body>
<div id="tap"><div>Tap once to activate<br>the weather display<small>After this, leave the Echo Show alone.</small></div></div>
<div id="app"><div id="loading">Loading Kochi weather…</div></div>

<script>
const LAT=9.939093, LON=76.270523;
const API='https://api.open-meteo.com/v1/forecast';
const codes={
0:['Clear','☀️'],1:['Mainly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],
45:['Fog','🌫️'],48:['Rime fog','🌫️'],51:['Light drizzle','🌦️'],53:['Drizzle','🌦️'],55:['Heavy drizzle','🌧️'],
56:['Freezing drizzle','🌧️'],57:['Freezing drizzle','🌧️'],61:['Light rain','🌦️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],
66:['Freezing rain','🌧️'],67:['Freezing rain','🌧️'],71:['Snow','🌨️'],73:['Snow','🌨️'],75:['Heavy snow','❄️'],
77:['Snow grains','❄️'],80:['Rain showers','🌦️'],81:['Rain showers','🌧️'],82:['Heavy showers','⛈️'],
85:['Snow showers','🌨️'],86:['Snow showers','🌨️'],95:['Thunderstorm','⛈️'],96:['Thunderstorm','⛈️'],99:['Thunderstorm','⛈️']
};
function getCode(c){return codes[c]||['Weather','🌤️']}
function fmtHour(s){let d=new Date(s),h=d.getHours();return (h%12||12)+' '+(h>=12?'PM':'AM')}
function fmtDate(){return new Intl.DateTimeFormat('en-IN',{weekday:'long',day:'numeric',month:'long',timeZone:'Asia/Kolkata'}).format(new Date())}
function fmtDay(s){return new Intl.DateTimeFormat('en-IN',{weekday:'short',timeZone:'Asia/Kolkata'}).format(new Date(s+'T12:00:00+05:30'))}
function fmtShortDate(s){return new Intl.DateTimeFormat('en-IN',{day:'numeric',month:'short',timeZone:'Asia/Kolkata'}).format(new Date(s+'T12:00:00+05:30'))}
function fmtTime(s){return new Intl.DateTimeFormat('en-IN',{hour:'numeric',minute:'2-digit',timeZone:'Asia/Kolkata'}).format(new Date(s))}

async function load(){
 try{
  const u=API+'?latitude='+LAT+'&longitude='+LON+'&timezone=Asia%2FKolkata&forecast_days=7'
   +'&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,surface_pressure,wind_speed_10m,wind_direction_10m'
   +'&hourly=temperature_2m,precipitation_probability,weather_code'
   +'&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max,sunrise,sunset';
  const r=await fetch(u,{cache:'no-store'}); if(!r.ok) throw new Error('network');
  const d=await r.json(), cur=d.current, c=getCode(cur.weather_code);
  let start=d.hourly.time.findIndex(t=>t>=cur.time); if(start<0)start=0;

  const hs=[];
  for(let i=start;i<start+8&&i<d.hourly.time.length;i++){
   const hc=getCode(d.hourly.weather_code[i]);
   hs.push(`<div class="card"><div class="time">${i===start?'NOW':fmtHour(d.hourly.time[i])}</div><div class="ico">${hc[1]}</div><div class="ct">${Math.round(d.hourly.temperature_2m[i])}°</div><div class="rain">${Math.round(d.hourly.precipitation_probability[i]||0)}% rain</div></div>`);
  }

  const weekly=[];
  for(let j=0;j<7&&j<d.daily.time.length;j++){
   const wc=getCode(d.daily.weather_code[j]);
   weekly.push(`<div class="daycard ${j===0?'today':''}">
    <div class="dayname">${j===0?'Today':fmtDay(d.daily.time[j])}</div>
    <div class="daydate">${fmtShortDate(d.daily.time[j])}</div>
    <div class="dayico">${wc[1]}</div>
    <div class="daytemp">${Math.round(d.daily.temperature_2m_max[j])}° / ${Math.round(d.daily.temperature_2m_min[j])}°</div>
    <div class="dayrain">💧 ${Math.round(d.daily.precipitation_probability_max[j]||0)}%</div>
   </div>`);
  }

  const windDir=Math.round(cur.wind_direction_10m);
  document.getElementById('app').innerHTML=`
   <div class="top">
    <div><div class="location">KOCHI, KERALA</div><div class="date">${fmtDate()}</div></div>
    <div class="updated">Updated ${fmtTime(cur.time)}</div>
   </div>

   <div class="main">
    <div class="current">
      <div class="currentIcon">${c[1]}</div>
      <div>
       <div><span class="temp">${Math.round(cur.temperature_2m)}</span><span class="unit">°C</span></div>
       <div class="condition">${c[0]}</div>
       <div class="feels">Feels like ${Math.round(cur.apparent_temperature)}°C</div>
       <div class="hl"><span>H ${Math.round(d.daily.temperature_2m_max[0])}°</span><span>L ${Math.round(d.daily.temperature_2m_min[0])}°</span></div>
      </div>
    </div>

    <div class="details">
      <div class="ico">💧</div><div class="label">Humidity</div><div class="value">${Math.round(cur.relative_humidity_2m)}%</div>
      <div class="ico">💨</div><div class="label">Wind</div><div class="value">${Math.round(cur.wind_speed_10m)} km/h (${windDir}°)</div>
      <div class="ico">◉</div><div class="label">Pressure</div><div class="value">${Math.round(cur.surface_pressure)} hPa</div>
      <div class="ico">☔</div><div class="label">Chance of rain</div><div class="value">${Math.round(cur.precipitation||0)}%</div>
      <div class="ico">🌅</div><div class="label">Sunrise</div><div class="value">${fmtTime(d.daily.sunrise[0])}</div>
      <div class="ico">🌇</div><div class="label">Sunset</div><div class="value">${fmtTime(d.daily.sunset[0])}</div>
    </div>
   </div>

   <div class="weeklySection">
    <div class="sectionTitle">7-DAY FORECAST</div>
    <div class="weekly">${weekly.join('')}</div>
   </div>

   <div class="hourlySection">
    <div class="sectionTitle">HOURLY FORECAST</div>
    <div class="hourly">${hs.join('')}</div>
   </div>

   <div class="footer"><span>Data: Open-Meteo</span><span>Auto-updates every 10 minutes</span></div>`;
 }catch(e){
  document.getElementById('app').innerHTML='<div id="loading">Weather temporarily unavailable — retrying…</div>';
 }
}
load(); setInterval(load,10*60*1000);

document.getElementById('tap').addEventListener('click',async()=>{
 document.getElementById('tap').classList.add('hidden');
 try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(e){}
});
</script>
<script>var AlwaysUseSilk=true</script>
<script defer src="https://dagammla.gitlab.io/keep-silk-open/keep.js"></script>
</body>
</html>
